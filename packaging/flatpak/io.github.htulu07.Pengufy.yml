id: io.github.htulu07.Pengufy
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: pengufy
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # spotifyd's media controls (MPRIS) for media keys and the desktop's player widget
  - --own-name=org.mpris.MediaPlayer2.spotifyd.*
  - --own-name=rs.spotifyd.*
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: python-requests
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=${FLATPAK_DEST} --no-build-isolation requests
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
        sha256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
      - type: file
        url: https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl
        sha256: b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685

  - name: spotifyd
    buildsystem: simple
    build-commands:
      - install -Dm755 spotifyd ${FLATPAK_DEST}/bin/spotifyd
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/Spotifyd/spotifyd/releases/download/v0.4.2/spotifyd-linux-x86_64-full.tar.gz
        sha256: 0c0657c61245355dc37e522f19cb1d73b947dbbc430d491aa9303e23c825c089
        strip-components: 0
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/Spotifyd/spotifyd/releases/download/v0.4.2/spotifyd-linux-aarch64-full.tar.gz
        sha256: 723872217c92ce9f10692caf4e96ddd8791b373ebd6dfb2eb42152a9cb56eda2
        strip-components: 0

  - name: pengufy
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/lib/pengufy
      - cp -r pengufy ${FLATPAK_DEST}/lib/pengufy/
      - printf '#!/bin/sh\nPYTHONPATH=/app/lib/pengufy exec python3 -m pengufy "$@"\n' > ${FLATPAK_DEST}/bin/pengufy
      - chmod 755 ${FLATPAK_DEST}/bin/pengufy
      - install -Dm644 data/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 data/${FLATPAK_ID}.svg -t ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: dir
        path: ../..
        skip: [.git, screenshots, packaging]
